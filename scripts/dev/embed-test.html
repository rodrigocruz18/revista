<!doctype html>
<!-- SOLO desarrollo: simula una web externa que embebe el widget /embed.
     Con `npm run dev` corriendo, abre este archivo directo en el navegador. -->
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Prueba widget /embed</title>
    <style>
      body { margin: 24px; background: #eceae4; font: 13px system-ui, sans-serif; color: #333; }
      label { display: block; margin-bottom: 6px; font-weight: 600; }
      .grid { display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start; }
      iframe { display: block; border: 0; background: #fff; }
      .resizable { resize: both; overflow: hidden; width: 720px; height: 360px; outline: 1px dashed #999; }
      .resizable iframe { width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <p>
      Servidor:
      <input id="base" value="http://localhost:3000" size="28" />
      <button onclick="load()">Recargar</button>
    </p>

    <label>Redimensionable (arrastra la esquina inferior derecha)</label>
    <div class="resizable"><iframe data-embed title="Revista Ace Tenis"></iframe></div>

    <div class="grid" style="margin-top: 28px">
      <div><label>960 × 420 (hero)</label><iframe data-embed style="width: 960px; height: 420px"></iframe></div>
      <div><label>360 × 600 (móvil / sidebar)</label><iframe data-embed style="width: 360px; height: 600px"></iframe></div>
      <div><label>300 × 250 (caja)</label><iframe data-embed style="width: 300px; height: 250px"></iframe></div>
      <div><label>728 × 160 (banner)</label><iframe data-embed style="width: 728px; height: 160px"></iframe></div>
    </div>

    <script>
      function load() {
        const base = document.getElementById("base").value.replace(/\/$/, "");
        document.querySelectorAll("[data-embed]").forEach((f) => (f.src = base + "/embed"));
      }
      load();
    </script>
  </body>
</html>
